<!-- FRAME example: coloured card bg + banner + 2-across image block + icon social + copyright footer. -->
<div style='margin:0; padding:20px 0; width:100%; background:#f3eee7; font-family:Arial, Helvetica, sans-serif;'>
  <div style='width:100%; max-width:640px; margin:0 auto; background:#fffdf8; box-shadow:0 0 6px #d8cfc0;'>
    <div style='padding:20px 24px; background:#7a6147; text-align:center;'><a href='[domain]' style='text-decoration:none;'><img src='[logo]' alt='[brand]' style='display:inline-block; width:100%; max-width:150px; height:auto; border:0;'/></a></div>
    <img src='[banner]' alt='[banner_alt]' style='display:block; width:100%; max-width:640px; height:auto; border:0;'/>
    <div style='padding:22px 32px 6px 32px; text-align:center;'><div style='font-family:Arial, Helvetica, sans-serif; font-size:28px; line-height:1.3; font-weight:bold; color:#43352a; margin:0;'>[title]</div></div>
    <div style='padding:8px 32px 18px 32px; text-align:center; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:1.6; color:#6b5d50;'>[content]</div>
    <div style='padding:0 22px 20px 22px;'><div style='font-size:0; text-align:center;'><div style='display:inline-block; width:100%; max-width:288px; vertical-align:top; font-size:16px;'><img src='[image_1]' alt='[image_1_alt]' style='display:block; width:100%; max-width:276px; height:auto; border:0; border-radius:6px; margin:6px auto;'/></div><div style='display:inline-block; width:100%; max-width:288px; vertical-align:top; font-size:16px;'><img src='[image_2]' alt='[image_2_alt]' style='display:block; width:100%; max-width:276px; height:auto; border:0; border-radius:6px; margin:6px auto;'/></div></div></div>
    <div style='padding:6px 24px 24px 24px; text-align:center; border-top:1px solid #ece3d6;'>
      <div style='font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:bold; color:#9a7e5c; margin:16px 0 12px 0;'>Theo dõi chúng tôi</div>
      <a href='[facebook]' style='display:inline-block; margin:0 6px;'><img src='[icon_facebook]' alt='Facebook' style='width:30px; height:30px; border:0;'/></a><a href='[instagram]' style='display:inline-block; margin:0 6px;'><img src='[icon_instagram]' alt='Instagram' style='width:30px; height:30px; border:0;'/></a><a href='[tiktok]' style='display:inline-block; margin:0 6px;'><img src='[icon_tiktok]' alt='TikTok' style='width:30px; height:30px; border:0;'/></a>
    </div>
  </div>
  <div style='width:100%; max-width:640px; margin:0 auto; padding:16px 24px 6px 24px; text-align:center; color:#9a8d7e;'>
    <div style='font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; margin:0 0 6px 0;'>[contact]</div>
    <div style='font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; margin:0 0 6px 0;'>Copyright &copy; [name]</div>
    <div style='font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; margin:0;'><a href='[unsubscribe]' style='color:#7a6147; text-decoration:underline;'>Hủy đăng ký</a> &middot; <a href='[domain]' style='color:#7a6147; text-decoration:underline;'>Xem trên trình duyệt</a></div>
  </div>
</div>
