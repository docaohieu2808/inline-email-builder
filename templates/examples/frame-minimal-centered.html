<!-- FRAME example: minimal — centred logo on white, no band, no banner. [title]/[content] tokens. -->
<div style='margin:0; padding:24px 0; width:100%; background:#f5f3ef; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;'>
  <div style='width:100%; max-width:560px; margin:0 auto; background:#ffffff;'>
    <div style='padding:28px 32px 6px 32px; text-align:center;'>
      <a href='[domain]' style='text-decoration:none;'><img src='[logo]' alt='[brand]' style='display:inline-block; width:100%; max-width:140px; height:auto; border:0;'/></a>
    </div>
    <div style='padding:18px 44px 8px 44px; text-align:center;'>
      <div style='font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:28px; line-height:1.3; font-weight:bold; color:#2b2b2b; margin:0;'>[title]</div>
    </div>
    <div style='padding:8px 44px 24px 44px; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:16px; line-height:1.6; color:#555555;'>
      [content]
    </div>
    <div style='padding:0 44px 28px 44px; text-align:center;'>
      <div style='height:1px; background:#e7e3dc; line-height:1px; font-size:1px;'>&nbsp;</div>
      <div style='font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:13px; line-height:1.6; color:#8a857c; margin-top:18px;'><a href='[facebook]' style='color:#555555; text-decoration:none;'>Facebook</a> &nbsp;·&nbsp; <a href='[instagram]' style='color:#555555; text-decoration:none;'>Instagram</a></div>
      <div style='font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6; color:#a8a298; margin-top:10px;'>[contact] &middot; <a href='[unsubscribe]' style='color:#8a857c; text-decoration:underline;'>Hủy đăng ký</a> &middot; <a href='[domain]' style='color:#8a857c; text-decoration:underline;'>Xem trên trình duyệt</a></div>
    </div>
  </div>
</div>
