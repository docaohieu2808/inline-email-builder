<!-- FRAME example: coloured header band + optional banner + [title]/[content] slots + footer.
     Text = tokens she fills. Drop the <img [banner]> line if no banner. -->
<div style='margin:0; padding:22px 0; width:100%; background:#eaf4fb; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;'>
  <div style='width:100%; max-width:600px; margin:0 auto; background:#ffffff;'>
    <div style='padding:20px 24px; background:#0076ce; text-align:center;'>
      <a href='[domain]' style='text-decoration:none;'><img src='[logo]' alt='[brand]' style='display:inline-block; width:100%; max-width:120px; height:auto; border:0;'/></a>
    </div>
    <img src='[banner]' alt='[banner_alt]' style='display:block; width:100%; max-width:600px; height:auto; border:0;'/>
    <div style='padding:26px 40px 8px 40px; text-align:center;'>
      <div style='font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:30px; line-height:1.3; font-weight:bold; color:#0b2545; margin:0;'>[title]</div>
    </div>
    <div style='padding:8px 40px 24px 40px; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:16px; line-height:1.6; color:#475569;'>
      [content]
    </div>
    <div style='padding:18px 40px 24px 40px; text-align:center; border-top:1px solid #dbe9f4;'>
      <div style='font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; color:#7b8a9a;'><a href='[facebook]' style='color:#0076ce; text-decoration:none;'>Facebook</a> &nbsp;·&nbsp; <a href='[instagram]' style='color:#0076ce; text-decoration:none;'>Instagram</a> &nbsp;·&nbsp; <a href='[youtube]' style='color:#0076ce; text-decoration:none;'>YouTube</a></div>
      <div style='font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6; color:#8a97a6; margin-top:12px;'>[contact]</div>
      <div style='font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6; color:#8a97a6; margin-top:6px;'><a href='[unsubscribe]' style='color:#475569; text-decoration:underline;'>Hủy đăng ký</a> &middot; <a href='[domain]' style='color:#475569; text-decoration:underline;'>Xem trên trình duyệt</a></div>
    </div>
  </div>
</div>
