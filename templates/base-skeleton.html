<!-- inline-email-builder · base skeleton
     Fragment only · inline CSS only · fluid responsive (NO media queries).
     THEME tokens [color_*]/[bg_*] are replaced with real hex by the skill.
     MERGE tokens ([logo],[title],[content],[facebook]...) stay as-is unless the brief
     provides a concrete value, so the backend merge pipeline can fill them.
     Remove the BANNER and/or CTA block if the brief does not ask for them. -->
<div style='margin:0; padding:24px 0; width:100%; background:[bg_page]; font-family:Arial,Helvetica,sans-serif; -webkit-text-size-adjust:100%;'>

  <!-- hidden preview text -->
  <div style='display:none; max-height:0; overflow:hidden; opacity:0;'>[preheader]</div>

  <!-- card -->
  <div style='width:100%; max-width:640px; margin:0 auto; background:[bg_card]; box-shadow:0 0 5px #cccccc;'>

    <!-- logo -->
    <div style='padding:24px 24px 8px 24px; text-align:left;'>
      <a href='[domain]' style='text-decoration:none;'><img src='[logo]' alt='[name] logo' style='display:block; width:100%; max-width:200px; height:auto; border:0;'/></a>
    </div>

    <!-- BANNER (optional) -->
    <a href='[banner_url]' style='text-decoration:none;'><img src='[banner]' alt='[banner_alt]' style='display:block; width:100%; max-width:640px; height:auto; border:0;'/></a>

    <!-- body -->
    <div style='padding:8px 24px 24px 24px;'>
      <div style='text-align:center; font-size:26px; line-height:1.3; font-weight:bold; color:[color_heading]; margin:16px 0;'>[title]</div>
      <div style='font-size:16px; line-height:1.6; color:[color_text];'>[content]</div>

      <!-- CTA (optional) -->
      <div style='text-align:center; margin:28px 0 8px 0;'>
        <a href='[cta_url]' style='display:inline-block; background:[color_accent]; color:#ffffff; text-decoration:none; font-size:16px; font-weight:bold; padding:14px 28px; border-radius:6px;'>[cta_text]</a>
      </div>
    </div>

    <!-- social -->
    <div style='padding:8px 24px 24px 24px; text-align:center;'>
      <div style='font-size:15px; font-weight:bold; color:[color_heading]; margin-bottom:10px;'>Find us online</div>
      <div>
        <a href='[domain]' target='_blank' style='display:inline-block; margin:0 6px;'><img src='[icon_website]' alt='Website' style='width:32px; height:32px; border:0;'/></a>
        <a href='[facebook]' target='_blank' style='display:inline-block; margin:0 6px;'><img src='[icon_facebook]' alt='Facebook' style='width:32px; height:32px; border:0;'/></a>
        <a href='[instagram]' target='_blank' style='display:inline-block; margin:0 6px;'><img src='[icon_instagram]' alt='Instagram' style='width:32px; height:32px; border:0;'/></a>
        <a href='[youtube]' target='_blank' style='display:inline-block; margin:0 6px;'><img src='[icon_youtube]' alt='YouTube' style='width:32px; height:32px; border:0;'/></a>
      </div>
    </div>

  </div>

  <!-- footer -->
  <div style='width:100%; max-width:640px; margin:0 auto; padding:16px 24px; color:#777777; font-size:12px; text-align:center; line-height:1.6;'>
    <div style='margin-bottom:8px;'>[contact]</div>
    <div style='margin-bottom:8px;'>Copyright &copy; [year] [name]</div>
    <div>You can <a href='[unsubscribe]' target='_blank' style='text-decoration:none; color:#9e9e9e;'>unsubscribe</a> or <a href='[domain]' target='_blank' style='text-decoration:none; color:#9e9e9e;'>view in browser</a>.</div>
  </div>

</div>
