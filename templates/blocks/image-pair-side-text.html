<!-- 2 images stacked on the LEFT + text on the RIGHT (desktop) → stack (mobile). Swap the two
     column <div>s to put images on the RIGHT. Text slot = [content]. -->
<div style='font-size:0; text-align:center;'>
  <div style='display:inline-block; width:100%; max-width:230px; vertical-align:middle; font-size:16px;'>
    <img src='[image_1]' alt='[image_1_alt]' style='display:block; width:100%; max-width:218px; height:auto; border:0; border-radius:6px; margin:0 auto 8px auto;'/>
    <img src='[image_2]' alt='[image_2_alt]' style='display:block; width:100%; max-width:218px; height:auto; border:0; border-radius:6px; margin:0 auto;'/>
  </div><div style='display:inline-block; width:100%; max-width:320px; vertical-align:middle; font-size:16px; text-align:left;'>
    <div style='padding:0 8px 0 22px; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:15px; line-height:1.6; color:#475569;'>[content]</div>
  </div>
</div>
