<!-- Offer box (no code) = SOLID pastel-of-accent box. For a real coupon CODE use a DASHED border instead. -->
<div style='background:#f1ecff; border:1px solid #d9ccff; border-radius:10px; padding:22px; text-align:center;'>
  <div style='font-family:Arial, Helvetica, sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#7c3aed; font-weight:bold; margin:0 0 7px 0;'>[offer_label]</div>
  <div style='font-family:Arial, Helvetica, sans-serif; font-size:30px; line-height:1.3; font-weight:bold; color:#4a2f7a; margin:0;'>[offer]</div>
</div>
