<!-- CTA = ONE big padded <a> button, solid accent bg + white text, rounded. Never an image. -->
<div style='text-align:center; padding:8px 0;'>
  <a href='[cta_url]' style='display:inline-block; background:#7c3aed; color:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:1.4; font-weight:bold; text-decoration:none; padding:15px 46px; border-radius:8px;'>[cta_text]</a>
</div>
