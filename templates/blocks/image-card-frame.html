<!-- Framed image card (PowerPoint-placeholder style): border + white mat + radius + shadow + caption.
     NEVER a bare <img> in the body. Recolour border/caption to the brand. Drop the caption div if unused. -->
<div style='max-width:240px; margin:8px auto; background:#ffffff; border:1px solid #e6e6e6; border-radius:12px; padding:10px; box-shadow:0 2px 9px rgba(0,0,0,0.08);'>
  <img src='[image_1]' alt='[image_1_alt]' style='display:block; width:100%; max-width:218px; height:auto; border:0; border-radius:8px; margin:0 auto;'/>
  <div style='font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:bold; color:#333333; text-align:center; margin:10px 0 4px 0;'>[image_1_caption]</div>
</div>
